<style>

ight:30px;border-radius:9px;background:#263452;color:#b9c8e7;font-weight:800}.choice.selected{border-color:var(--accent);background:#242a4d}.choice.selected .letter{background:var(--accent);color:white}.choice:disabled{cursor:default}.choice.correct{border-color:var(--good);background:#14372f}.choice.correct .letter{background:var(--good);color:#07281d}.choice.wrong{border-color:var(--bad);background:#402330}.choice.wrong .letter{background:var(--bad);color:#38111b}.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#13382f;color:#b8f4db;border:1px solid #276b54}.feedback.bad{background:#41242f;color:#ffd1d9;border:1px solid #844253}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;color:white;background:linear-gradient(100deg,#796cf4,#5e8cf7);box-shadow:0 8px 20px #6154ce30}.btn:hover:not(:disabled){filter:brightness(1.1)}.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.btn.subtle{background:#25314c;box-shadow:none;color:#c7d2eb}.finish{text-align:center;display:none}.finish .emoji{font-size:3rem}.finish h2{font-size:2rem;margin:8px}.bigscore{font-size:3.5rem;font-weight:900;color:var(--cyan);margin:14px}.finish p{color:var(--muted);line-height:1.6}.roundbadge{display:inline-block;border:1px solid #3d4e72;background:#202c48;color:#d5dcff;border-radius:99px;padding:7px 12px;font-size:.8rem;font-weight:800;margin:4px}.foot{text-align:center;color:#71809d;font-size:.8rem;padding:17px 5px 4px}

</style></head><body><div class="wrap">
<header class="header"><div class="logo">🧬 &nbsp;UNIT 4 • BIOLOGY</div><h1>Cellular <span>Respiration</span></h1><p>Choose an answer, hit submit, check it, then move on.</p></header>
<main class="card" id="quiz"><div class="status"><span id="roundLabel">ROUND 1 • ORIGINAL</span><span class="score" id="score">Score: 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="qnum" id="qnumber">QUESTION 1 / 25</div><h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn subtle" id="restart">↻ Restart round</button><button class="btn" id="submit" disabled>Submit answer</button><button class="btn" id="next" style="display:none">Next question →</button></div></main>
<main class="card finish" id="finish"><div class="emoji">🎉</div><div class="roundbadge" id="finishedRound">ROUND COMPLETE</div><h2 id="finishTitle">Nice work!</h2><div class="bigscore" id="finalScore"></div><p id="message"></p><div class="actions" style="justify-content:center"><button class="btn subtle" id="retry">↻ Try this round again</button><button class="btn" id="remix">🔀 Round 2: Remix questions</button></div></main><div class="foot">Made for studying • Works offline • Share this single HTML file with your class</div></div>
<script>
// Core topics are the same in both rounds; the remix changes wording, order, and answer order.
const bank=[
{id:1,q:'What is the main goal of cellular respiration?',alt:'Why do cells do cellular respiration?',a:['Make glucose','Break down glucose to make ATP energy','Make sunlight','Create chlorophyll'],correct:1,ex:'Cells use ATP to power their activities.'},
{id:2,q:'Which stages are aerobic (require oxygen for the process to continue)?',alt:'Which parts of respiration are aerobic?',a:['Glycolysis and fermentation','Krebs cycle and ETC','Fermentation only','Glycolysis only'],correct:1,ex:'The Krebs cycle and electron transport chain are part of aerobic respiration.'},
{id:3,q:'Which processes can happen without oxygen?',alt:'What can take place when there is no oxygen available?',a:['Krebs cycle and ETC','ETC only','Glycolysis and fermentation','Krebs cycle only'],correct:2,ex:'Glycolysis can run without oxygen, and fermentation helps it continue.'},
{id:4,q:'How are photosynthesis and cellular respiration connected?',alt:'How do photosynthesis and respiration work together?',a:['They make the same thing','They are unrelated','One uses the products made by the other','Both only happen in mitochondria'],correct:2,ex:'Glucose and oxygen from photosynthesis are used in respiration; carbon dioxide and water can be reused in photosynthesis.'},
{id:5,q:'What happens during glycolysis?',alt:'What does glycolysis do to a glucose molecule?',a:['Glucose is split into two pyruvate and a net 2 ATP are made','Oxygen becomes glucose','The ETC makes most ATP','Carbon dioxide is turned into oxygen'],correct:0,ex:'Glycolysis breaks one glucose into two pyruvate.'},
{id:6,q:'When does glycolysis happen?',alt:'Which step happens first in cellular respiration?',a:['After the ETC','After the Krebs cycle','At the beginning of cellular respiration','Only when oxygen is present'],correct:2,ex:'It is the first stage of cellular respiration.'},
{id:7,q:'What happens in the Krebs cycle?',alt:'What is one job of the Krebs cycle?',a:['Sunlight is used to make glucose','Molecules are broken down, CO₂ is released, and energy carriers form','Oxygen is produced','Glucose is split into pyruvate'],correct:1,ex:'The cycle releases carbon dioxide and makes energy carriers and a little ATP.'},
{id:8,q:'When does the Krebs cycle take place?',alt:'The Krebs cycle comes after which step?',a:['Before glycolysis','After glycolysis when oxygen is available','During photosynthesis','Only during fermentation'],correct:1,ex:'Glycolysis happens first; the Krebs cycle is part of aerobic respiration.'},
{id:9,q:'What is the ETC’s main job?',alt:'What does the electron transport chain mainly do?',a:['Split glucose into pyruvate','Make alcohol','Use electron energy to make most ATP','Make glucose from sunlight'],correct:2,ex:'The electron transport chain produces the largest share of ATP.'},
{id:10,q:'Where does the ETC occur?',alt:'Where is the electron transport chain located?',a:['Cytoplasm','Nucleus','Outer cell membrane','Inner mitochondrial membrane'],correct:3,ex:'It is located along the folded inner membrane of mitochondria.'},
{id:11,q:'What are the reactants of cellular respiration?',alt:'Which materials go into cellular respiration?',a:['Carbon dioxide and water','Glucose and oxygen','ATP and sunlight','Alcohol and CO₂'],correct:1,ex:'These are the substances cells use in aerobic respiration.'},
{id:12,q:'What are the products of cellular respiration?',alt:'What comes out of cellular respiration?',a:['Glucose and oxygen','Sunlight and water','Carbon dioxide, water, and ATP','Alcohol and lactic acid'],correct:2,ex:'Respiration releases carbon dioxide and water and transfers energy to ATP.'},
{id:13,q:'What is alcohol fermentation?',alt:'What happens in alcohol fermentation?',a:['Making glucose from CO₂','Breaking down glucose without oxygen to produce alcohol and CO₂','Using oxygen to make lots of ATP','Making oxygen from water'],correct:1,ex:'Alcohol fermentation happens without oxygen; glycolysis supplies the 2 ATP.'},
{id:14,q:'What can happen when oxygen is not available?',alt:'If oxygen is missing, what may cells still do?',a:['The ETC keeps working normally','Photosynthesis begins in mitochondria','Glycolysis can continue with fermentation','The Krebs cycle speeds up'],correct:2,ex:'Fermentation allows glycolysis to continue in the absence of oxygen.'},
{id:15,q:'Where does fermentation happen?',alt:'In which part of the cell does fermentation take place?',a:['Mitochondria','Nucleus','Cytoplasm','Chloroplast'],correct:2,ex:'It takes place in the cytoplasm, like glycolysis.'},
{id:16,q:'Depending on the type, fermentation can produce…',alt:'Fermentation products can include which substances?',a:['Only oxygen and ATP','Lactic acid, or alcohol and carbon dioxide','Glucose and sunlight','Only water'],correct:1,ex:'Different kinds of fermentation have different products.'},
{id:17,q:'How much net ATP does glycolysis make per glucose?',alt:'What is glycolysis’s net ATP gain for one glucose?',a:['2 ATP','4 ATP net','32 ATP','0 ATP'],correct:0,ex:'It makes a net gain of two ATP.'},
{id:18,q:'How much ATP does the Krebs cycle make directly per glucose (study-guide estimate)?',alt:'Using the study-guide estimate, how much ATP does Krebs make directly?',a:['32 ATP','2 ATP','0 ATP','36 ATP'],correct:1,ex:'The Krebs cycle makes a small amount directly—2 ATP in this guide.'},
{id:19,q:'About how much ATP does the ETC make in the study-guide estimate?',alt:'In the guide’s estimate, how much ATP comes from the ETC?',a:['2 ATP','4 ATP','32–34 ATP','0 ATP'],correct:2,ex:'It makes most of the ATP—around 32 to 34 in this simplified estimate.'},
{id:20,q:'About how much ATP does cellular respiration make overall in the study guide?',alt:'What total ATP amount does this study guide estimate?',a:['2 ATP','About 36–38 ATP (some sources use around 30–32)','4 ATP','32 ATP from glycolysis alone'],correct:1,ex:'The total varies by textbook estimate; your guide lists about 36–38.'},
{id:21,q:'How much ATP does fermentation provide overall?',alt:'How much ATP does fermentation get from glycolysis?',a:['About 32 ATP','2 ATP','36 ATP','0 ATP'],correct:1,ex:'Fermentation gets its ATP from glycolysis, which nets 2 ATP.'},
{id:22,q:'Which organelle may be especially plentiful in cells with high energy needs?',alt:'Cells that need lots of energy may have more of which organelle?',a:['Nucleus','Golgi apparatus','Mitochondria','Chloroplasts'],correct:2,ex:'Mitochondria are where most aerobic ATP production occurs.'},
{id:23,q:'How does food help give our cells energy?',alt:'How do cells turn food energy into usable energy?',a:['Food turns directly into sunlight','Glucose is broken down through cellular respiration to make ATP','Food is stored only in the nucleus','Food makes oxygen without being broken down'],correct:1,ex:'Glucose from food is broken down and its energy is captured in ATP.'},
{id:24,q:'What happens to carbon in these processes?',alt:'How do photosynthesis and respiration move carbon?',a:['Photosynthesis releases CO₂; respiration absorbs it','Carbon disappears','Photosynthesis uses CO₂ to build glucose; respiration releases CO₂','Carbon changes into oxygen'],correct:2,ex:'Photosynthesis moves carbon from carbon dioxide into glucose; respiration releases CO₂ again.'},
{id:25,q:'Which comparison is correct?',alt:'Which statement correctly compares photosynthesis and cellular respiration?',a:['Photosynthesis uses CO₂ and water with light to make glucose and oxygen; respiration uses glucose and oxygen to make ATP, CO₂, and water','Both processes happen in the nucleus','Respiration makes glucose from sunlight','Photosynthesis uses glucose to make ATP'],correct:0,ex:'Photosynthesis and respiration have linked reactants and products, but different purposes.'}
];
let round=1,deck=[],pos=0,score=0,selected=null,locked=false,usedRemix=false;
const el=id=>document.getElementById(id);
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(remix=false){deck=shuffle(bank).map(item=>{let q=remix?item.alt:item.q;let options=item.a.map((txt,i)=>({txt,correct:i===item.correct}));options=shuffle(options);return {...item,displayQ:q,options}});pos=0;score=0;selected=null;locked=false;el('finish').style.display='none';el('quiz').style.display='block';render()}
function render(){let item=deck[pos];el('roundLabel').textContent=round===1?'ROUND 1 • ORIGINAL':'ROUND 2 • REMIX';el('score').textContent=`Score: ${score}`;el('qnumber').textContent=`QUESTION ${pos+1} / ${deck.length}`;el('bar').style.width=`${pos/deck.length*100}%`;el('question').textContent=item.displayQ;el('choices').innerHTML='';el('feedback').className='feedback';el('feedback').textContent='';el('submit').style.display='';el('submit').disabled=true;el('next').style.display='none';item.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${opt.txt}</span>`;b.onclick=()=>select(i);el('choices').appendChild(b)})}
function select(i){if(locked)return;selected=i;[...el('choices').children].forEach((b,j)=>b.classList.toggle('selected',i===j));el('submit').disabled=false}
function submit(){if(selected===null||locked)return;locked=true;let item=deck[pos],opt=item.options[selected],isRight=opt.correct;if(isRight)score++;el('score').textContent=`Score: ${score}`;[...el('choices').children].forEach((b,j)=>{b.disabled=true;if(item.options[j].correct)b.classList.add('correct');if(j===selected&&!isRight)b.classList.add('wrong')});el('feedback').className=`feedback show ${isRight?'good':'bad'}`;el('feedback').textContent=(isRight?'Correct! ':'Not quite. ')+item.ex;el('submit').style.display='none';el('next').style.display='';el('next').textContent=pos===deck.length-1?'See results →':'Next question →'}
function next(){if(pos<deck.length-1){pos++;selected=null;locked=false;render()}else finish()}
function finish(){el('quiz').style.display='none';el('finish').style.display='block';el('finishedRound').textContent=round===1?'ROUND 1 COMPLETE':'ROUND 2 COMPLETE';el('finishTitle').textContent=round===1?'Round 1 finished!':'Remix finished!';el('finalScore').textContent=`${score} / 25`;let p=score/25;el('message').textContent=p===1?'Perfect score! You got every question right.':p>=.8?'Great job! Review any misses and you’re looking good.':p>=.6?'Good effort—review the questions you missed and keep practicing.':'Keep at it. You can try the questions again to improve your score.';if(round===1){el('remix').style.display='';el('remix').textContent='🔀 Round 2: Remix questions'}else{el('remix').textContent='🔀 Restart Round 2'}el('bar').style.width='100%'}
function restart(){makeDeck(round===2)}
el('submit').onclick=submit;el('next').onclick=next;el('restart').onclick=restart;el('retry').onclick=restart;el('remix').onclick=()=>{if(round===1){round=2;usedRemix=true;makeDeck(true)}else makeDeck(true)};
makeDeck(false);
</script></body></html>
